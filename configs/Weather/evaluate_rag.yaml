### Dataset ###
data:
  name: custom
  folder: ./datasets/Weather

### RI-VerbalTS evaluation ###
eval:
  split: test
  n_samples: 10
  model_path: ""
  batch_size: 128
  max_batches: -1
  display_interval: 1
  device: cuda:0
  sampler: ddim
  cache_folder: ./cache/Weather
  save_predictions: true
  prediction_path: ""

  rag:
    enabled: true
    index_path: ./cache/rag/Weather/train_longclip.npz
    top_k: 1
    selection: top1
    temperature: 1.0
    seed: 42
    min_similarity: -1.0
    start_step: -1
    strength: 0.4
    mode: diffusion
    diverse_reference: false
    embedding_model_path: ./save/Longclip
    embedding_device: auto
    query_batch_size: 64
    trace_path: ""

    adaptive_controller:
      enabled: false
      checkpoint_path: ""
      feature_mode: score_only
      min_strength: 0.20
      max_strength: 0.95
      base_gamma: 1.0
      max_residual: 0.15
      gate_threshold: 0.50
